appId: com.avsignallab.app
productName: AV Signal Lab
directories:
  output: release
files:
  - src/**/*
  - data/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
